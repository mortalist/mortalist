<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <style>
    .t{font-family:'Courier New',monospace;font-weight:700;fill:#f5a623}
    .belt{stroke-dasharray:14 14;animation:move 0.8s linear infinite}
    @keyframes move{to{stroke-dashoffset:-28}}
    .item{animation:run 6s linear infinite}
    @keyframes run{from{transform:translateX(-60px)}to{transform:translateX(960px)}}
    .g1{transform-origin:70px 70px;animation:spin 6s linear infinite}
    .g2{transform-origin:830px 70px;animation:spin 6s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <g id="gear">
      <circle r="26" fill="none" stroke="#f5a623" stroke-width="10"/>
      <g stroke="#f5a623" stroke-width="10">
        <line x1="0" y1="-38" x2="0" y2="38"/><line x1="-38" y1="0" x2="38" y2="0"/>
        <line x1="-27" y1="-27" x2="27" y2="27"/><line x1="-27" y1="27" x2="27" y2="-27"/>
      </g>
      <circle r="9" fill="#1b1b1b"/>
    </g>
  </defs>
  <rect width="900" height="220" fill="#1b1b1b"/>
  <rect width="900" height="220" fill="none" stroke="#f5a623" stroke-width="3"/>
  <g class="g1"><use href="#gear" x="70" y="70"/></g>
  <g class="g2"><use href="#gear" x="830" y="70"/></g>
  <text x="450" y="85" text-anchor="middle" class="t" font-size="40">THE FACTORY MUST GROW</text>
  <text x="450" y="122" text-anchor="middle" class="t" font-size="20" fill="#9aa">&gt; automate everything<tspan class="cur">_</tspan></text>
  <rect x="0" y="160" width="900" height="36" fill="#3a3a3a"/>
  <line class="belt" x1="0" y1="178" x2="900" y2="178" stroke="#f5a623" stroke-width="22" opacity="0.55"/>
  <rect x="0" y="156" width="900" height="5" fill="#f5a623"/>
  <rect x="0" y="195" width="900" height="5" fill="#f5a623"/>
  <g class="item"><rect x="0" y="166" width="24" height="24" fill="#c8c8c8" stroke="#555" stroke-width="2"/></g>
  <g class="item" style="animation-delay:-2s"><rect x="0" y="166" width="24" height="24" fill="#e55039" stroke="#555" stroke-width="2"/></g>
  <g class="item" style="animation-delay:-4s"><rect x="0" y="166" width="24" height="24" fill="#4a90d9" stroke="#555" stroke-width="2"/></g>
</svg>
